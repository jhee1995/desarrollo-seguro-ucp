# Monitoreo en tiempo real de los escaneos de seguridad.
# scan.sh -> Pushgateway -> Prometheus -> Grafana (dashboard provisionado).
name: seclab-monitoring
services:
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: seclab-pushgw
    ports: ["127.0.0.1:9091:9091"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: seclab-prom
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [pushgateway]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: seclab-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=seclab
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
